name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure updater repository
        shell: pwsh
        run: |
          $cfg = Get-Content update_config.json | ConvertFrom-Json
          $cfg.github_repo = "${{ github.repository }}"
          $cfg | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 update_config.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        run: python build_tools/build_pyinstaller.py

      - name: Rename EXE
        shell: pwsh
        run: Move-Item dist/CastleHeightMapStudio.exe dist/CastleHeightMapStudio-Windows-x86_64.exe

      - name: Self-test Windows EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/CastleHeightMapStudio-Windows-x86_64.exe"
          $report = Join-Path $env:RUNNER_TEMP "CastleHeightMapStudio-self-test.txt"

          $env:CHMS_SELF_TEST_REPORT = $report

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList "--self-test" `
            -Wait `
            -PassThru

          if (Test-Path $report) {
            Write-Host "----- Castle HeightMap Studio self-test -----"
            Get-Content $report
            Write-Host "---------------------------------------------"
          }
          else {
            Write-Warning "Le rapport self-test n'a pas été créé."
          }

          if ($process.ExitCode -ne 0) {
            throw "Castle HeightMap Studio Windows self-test failed with exit code $($process.ExitCode)"
          }

          Write-Host "Windows EXE self-test OK"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/CastleHeightMapStudio-Windows-x86_64.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure updater repository
        run: |
          python - <<'PY'
          import json
          p = "update_config.json"
          d = json.load(open(p, encoding="utf-8"))
          d["github_repo"] = "${{ github.repository }}"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2)
          PY

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk curl libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build PyInstaller folder
        run: |
          python -m PyInstaller \
            castle_heightmap_studio.py \
            --name CastleHeightMapStudio \
            --windowed \
            --clean \
            --noconfirm \
            --collect-all cadquery \
            --collect-all OCP \
            --collect-all matplotlib \
            --add-data "docs:docs" \
            --add-data "assets:assets" \
            --add-data "examples:examples" \
            --add-data "update_config.json:."

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -a dist/CastleHeightMapStudio/. AppDir/usr/bin/
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/castle-heightmap-studio.desktop AppDir/castle-heightmap-studio.desktop
          cp assets/castle_heightmap_studio.png AppDir/castle-heightmap-studio.png
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          curl -L \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            AppDir \
            CastleHeightMapStudio-Linux-x86_64.AppImage

      - name: Self-test Linux AppImage
        run: |
          chmod +x CastleHeightMapStudio-Linux-x86_64.AppImage
          export CHMS_SELF_TEST_REPORT="$RUNNER_TEMP/CastleHeightMapStudio-self-test.txt"
          APPIMAGE_EXTRACT_AND_RUN=1 ./CastleHeightMapStudio-Linux-x86_64.AppImage --self-test
          echo "----- Castle HeightMap Studio self-test -----"
          cat "$CHMS_SELF_TEST_REPORT"
          echo "---------------------------------------------"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: CastleHeightMapStudio-Linux-x86_64.AppImage

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure updater repository
        run: |
          python - <<'PY'
          import json
          p = "update_config.json"
          d = json.load(open(p, encoding="utf-8"))
          d["github_repo"] = "${{ github.repository }}"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2)
          PY

      - name: Create source archive
        run: |
          zip -r CastleHeightMapStudio-Source.zip . \
            -x ".git/*" ".venv/*" "build/*" "dist/*" "__pycache__/*"

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: CastleHeightMapStudio-Source.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Castle HeightMap Studio $TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            artifacts/windows/CastleHeightMapStudio-Windows-x86_64.exe \
            artifacts/linux/CastleHeightMapStudio-Linux-x86_64.AppImage \
            artifacts/source/CastleHeightMapStudio-Source.zip \
            --clobber
